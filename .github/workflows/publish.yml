name: Publish the content library

# Every push to `main` validates the content, rebuilds it and publishes the
# result to GitHub Pages. The application then picks the new version up with
# its own update check.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # A weekly build catches any change made directly on GitHub.
    - cron: '17 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the image tools
        run: python -m pip install --upgrade Pillow

      - name: Validate the content
        run: python tools/validate_content.py

      - name: Build the library
        run: python tools/build_content.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
